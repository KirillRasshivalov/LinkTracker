app:
  github-token: ${GITHUB_TOKEN} # env variable
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}

spring:
  application:
    name: Scrapper
  liquibase:
    enabled: false
    change-log: ../../../../db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    ## ddl-auto: validate
    open-in-view: false
  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

logging:
  structured:
    format:
      console=ecs:
