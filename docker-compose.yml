version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: my_postgres1
    environment:
      POSTGRES_USER: kirill
      POSTGRES_PASSWORD: kirill
      POSTGRES_DB: my_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

volumes:
  postgres_data:

networks:
  my_network:
